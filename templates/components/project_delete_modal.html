<button
    type="button"
    class="project-delete-trigger"
    popovertarget="delete-project-{{ project.id }}"
    aria-label="Delete {{ project.title }}"
>
    Delete project
</button>

<div
    id="delete-project-{{ project.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-project-title-{{ project.id }}"
>
    <button
        type="button"
        class="project-delete-modal-backdrop"
        popovertarget="delete-project-{{ project.id }}"
        popovertargetaction="hide"
        aria-label="Close delete confirmation"
    ></button>

    <div class="project-delete-modal-content">
        <button
            type="button"
            class="project-delete-modal-close"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"
        >
            &times;
        </button>

        <h2 id="delete-project-title-{{ project.id }}">
            Delete project?
        </h2>

        <p>
            Are you sure you want to delete
            <strong>{{ project.title }}</strong>?
        </p>

        <div class="project-delete-modal-actions">
            <button
                type="button"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
            >
                Cancel
            </button>

            <form
                method="post"
                action="{% url 'main:delete_project' project.id %}"
            >
                {% csrf_token %}
                <button type="submit">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
