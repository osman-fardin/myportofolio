<div
    id="experience-delete-modal"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="experience-delete-title"
>
    <button
        type="button"
        class="project-delete-modal-backdrop"
        popovertarget="experience-delete-modal"
        popovertargetaction="hide"
        aria-label="Close delete confirmation"
    ></button>

    <div class="project-delete-modal-content">
        <button
            type="button"
            class="project-delete-modal-close"
            popovertarget="experience-delete-modal"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"
        >
            &times;
        </button>

        <h2 id="experience-delete-title">Delete experience?</h2>

        <p>
            Are you sure you want to delete
            <strong id="experience-delete-name">this experience</strong>?
        </p>

        <div class="project-delete-modal-actions">
            <button
                type="button"
                autofocus
                popovertarget="experience-delete-modal"
                popovertargetaction="hide"
            >
                Cancel
            </button>

            <form
                id="experience-delete-form"
                method="post"
                action="{% url 'main:delete_experience' experience_placeholder_id %}"
                data-api-url="{% url 'api:experience-detail' experience_placeholder_id %}"
                aria-busy="false"
            >
                {% csrf_token %}
                <button type="submit">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
