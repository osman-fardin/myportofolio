{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block page_title %}{{ name }} | Portfolio{% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/menu.js' %}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'main:show_main' %}" class="brand">
                {{ display_name }}
            </a>

            <details class="site-menu">
                <summary class="menu-toggle">
                    <span class="menu-open-label">Menu</span>
                    <span class="menu-close-label">Close</span>
                </summary>

                <div class="menu-panel">
                    <nav
                        class="menu-navigation"
                        aria-label="Primary Navigation"
                    >
                        <a href="{% url 'main:show_main' %}">
                            <span>01</span>
                            Home
                        </a>
                        <a href="{% url 'main:show_main' %}#about">
                            <span>02</span>
                            About
                        </a>
                        <a href="{% url 'main:show_experience' %}">
                            <span>03</span>
                            Experience
                        </a>
                        <a href="{% url 'main:show_projects' %}">
                            <span>04</span>
                            Projects
                        </a>
                        <a href="{% url 'main:show_main' %}#contact">
                            <span>05</span>
                            Contact
                        </a>
                    </nav>
                </div>
            </details>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 {{ name }}.
                Fakultas Ilmu Komputer, Universitas Indonesia.
            </p>
        </div>
    </footer>
</body>
</html>
